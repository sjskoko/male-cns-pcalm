[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "male-cns-pcalm"
version = "0.2.0"
description = "Connectome-constrained predictive coding with augmented Lagrangian local learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Codex research prototype" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "pyyaml>=6",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
flypcalm = "flypcalm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flypcalm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
